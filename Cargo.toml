[package]
name = "toshokan"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
governor = "0.10.4"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
