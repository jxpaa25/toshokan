[package]
name = "toshokan"
version = "0.1.0"
edition = "2024"

[dependencies]
base64-simd = "0.8"
bytes = "1.12.1"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
fast_image_resize = { version = "6.1", features = ["image", "rayon"] }
futures-util = "0.3.34"
governor = "0.10.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
rustix = { version = "1", features = ["event", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
toml = "1.1.8"
toml_edit = "0.25.17"
unicode-width = "0.2"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

# Image decoding and resizing are ~20x slower unoptimized, which made reading unusable under
# `cargo run`. Optimize dependencies fully and our own code lightly (generic resize code from
# fast_image_resize is compiled into this crate).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
